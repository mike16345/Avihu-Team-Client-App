appId: ${MAESTRO_APP_ID}
name: Invalid recovery email remains on forgot password
---
- runFlow: subflows/reset-to-login.yaml
- tapOn:
    id: e2e-forgot-password-open
    waitToSettleTimeoutMs: 500
- tapOn:
    id: e2e-forgot-password-email
    waitToSettleTimeoutMs: 500
- inputText: not-an-email
- hideKeyboard
- tapOn:
    id: e2e-forgot-password-submit
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: e2e-forgot-password-root
- assertVisible:
    id: e2e-forgot-password-email-error
