appId: ${MAESTRO_APP_ID}
name: Invalid login form remains on the login surface
---
- runFlow: subflows/reset-to-login.yaml
- tapOn:
    id: e2e-login-email
    waitToSettleTimeoutMs: 500
- runFlow:
    file: subflows/fast-input.yaml
    env:
      TEXT: not-an-email
- hideKeyboard
- tapOn:
    id: e2e-login-submit
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: e2e-login-root
- assertVisible:
    id: e2e-login-email
- assertVisible:
    id: e2e-login-email-error
- assertVisible:
    id: e2e-login-password-error
- assertVisible:
    id: e2e-login-submit
