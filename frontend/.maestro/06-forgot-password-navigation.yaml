appId: ${MAESTRO_APP_ID}
name: Forgot password opens and returns to login
---
- runFlow: subflows/reset-to-login.yaml
- tapOn:
    id: e2e-forgot-password-open
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: e2e-forgot-password-root
- assertVisible:
    id: e2e-forgot-password-email
- assertVisible:
    id: e2e-forgot-password-submit
- tapOn:
    id: e2e-forgot-password-back
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: e2e-login-root
- assertVisible:
    id: e2e-login-email
