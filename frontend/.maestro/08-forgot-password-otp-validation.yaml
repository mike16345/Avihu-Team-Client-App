appId: ${MAESTRO_APP_ID}
name: OTP request opens validation and rejects malformed code
---
- runFlow: subflows/reset-to-login.yaml
- tapOn:
    id: e2e-forgot-password-open
    waitToSettleTimeoutMs: 500
- tapOn:
    id: e2e-forgot-password-email
    waitToSettleTimeoutMs: 500
- runFlow:
    file: subflows/fast-input.yaml
    env:
      TEXT: ${MAESTRO_E2E_EMAIL}
- hideKeyboard
- tapOn:
    id: e2e-forgot-password-submit
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: e2e-otp-input
    timeout: 20000
- tapOn:
    id: e2e-otp-input
    waitToSettleTimeoutMs: 500
- runFlow:
    file: subflows/fast-input.yaml
    env:
      TEXT: "12345"
- hideKeyboard
- tapOn:
    id: e2e-otp-submit
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: e2e-forgot-password-root
- assertVisible:
    id: e2e-otp-error
